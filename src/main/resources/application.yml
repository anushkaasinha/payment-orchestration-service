server:
  port: ${PORT:8080}
spring:
  application:
    name: payment-orchestration
  datasource:
    url: jdbc:h2:mem:payments;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health
payments:
  admin-key: ${ADMIN_KEY:admin_secret_123}
  seed-merchant-key: ${SEED_MERCHANT_KEY:m_demo_merchant_key}
  platform-fee-percent: 2.0
  scheduling:
    enabled: true
  gateways:
    priority: PAYU,PAYTM,STRIPE
  breaker:
    failure-threshold: 3
    open-seconds: 30
  retry:
    base-delay-seconds: 2
    max-delay-seconds: 300
    poll-ms: 2000
  webhook:
    max-attempts: 5
    base-delay-seconds: 2
    allow-private: ${WEBHOOK_ALLOW_PRIVATE:true}
